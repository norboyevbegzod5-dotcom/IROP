<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Админка РОП</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #15171a;
    --hint: #6b7280;
    --line: #e5e7eb;
    --accent: #2481cc;
    --good: #16a34a;
    --mid: #d97706;
    --bad: #dc2626;
    --track: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --text: #e8eaed;
      --hint: #9aa0a6;
      --line: #2a2e36;
      --accent: #4ea1e6;
      --track: #262a31;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: none; color: var(--hint); padding: 7px 12px; border-radius: 8px;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: #fff; }
  h2 { font-size: 16px; margin: 24px 0 10px; }
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .people { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
  .kpi-label { color: var(--hint); font-size: 13px; }
  .kpi-value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi-plan { color: var(--hint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .bar.good > i { background: var(--good); }
  .bar.mid > i { background: var(--mid); }
  .bar.bad > i { background: var(--bad); }
  .row { margin-top: 12px; }
  .row-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .row-head b { font-variant-numeric: tabular-nums; }
  .muted { color: var(--hint); }
  .person-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .person-name { font-size: 16px; font-weight: 700; }
  .tag { font-size: 12px; color: var(--hint); white-space: nowrap; }
  .tag.off { color: var(--bad); }
  .mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .mini div { background: var(--bg); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .mini span { display: block; color: var(--hint); font-size: 12px; }
  .mini b { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .reports-line { margin-top: 12px; font-size: 13px; color: var(--hint); }
  /* Планы */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--hint); font-weight: 600; }
  td input {
    width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 16px; font-variant-numeric: tabular-nums;
  }
  td input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .save-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .btn {
    border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
  }
  .btn:disabled { opacity: 0.6; }
  .hint { font-size: 13px; color: var(--hint); }
  /* Отчёты */
  details { border-bottom: 1px solid var(--line); padding: 10px 0; }
  details:last-child { border-bottom: 0; }
  summary { cursor: pointer; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary b { font-weight: 600; }
  .report-text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; font-size: 14px; }
  .empty { color: var(--hint); text-align: center; padding: 18px; }
  #error { display: none; background: #fde8e8; color: #9b1c1c; padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📊 Админка РОП</h1>
      <div class="sub" id="periodInfo">Загрузка…</div>
    </div>
    <div class="seg" id="periods"></div>
  </header>

  <div id="error"></div>

  <h2>Команда</h2>
  <div class="grid kpis" id="kpis"></div>

  <h2>Планы сотрудников</h2>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Сотрудник</th>
            <th>Звонков в день</th>
            <th>План продаж в месяц, сум</th>
            <th>Новых подключений в месяц</th>
          </tr>
        </thead>
        <tbody id="plansBody"></tbody>
      </table>
    </div>
    <div class="save-row">
      <button class="btn" id="saveBtn">Сохранить планы</button>
      <span class="hint" id="saveStatus">Продажи считаются по фактическим поступлениям денег из вечерних отчётов.</span>
    </div>
  </div>

  <h2>Статистика по сотрудникам</h2>
  <div class="grid people" id="people"></div>

  <h2>Отчёты сотрудников</h2>
  <div class="card" id="reports"></div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg && tg.initData) { tg.ready(); tg.expand(); }

const base = location.pathname.replace(/\/$/, "");
let period = new URLSearchParams(location.search).get("period") || "month";
let data = null;

const $ = (id) => document.getElementById(id);
const fmt = (n) => (n === null || n === undefined ? "—" : Number(n).toLocaleString("ru-RU"));
const money = (n) => (n === null || n === undefined ? "—" : `${fmt(n)} сум`);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bar(fact, plan) {
  const b = el("div", "bar");
  const i = el("i");
  if (plan) {
    const pct = (fact / plan) * 100;
    b.classList.add(pct >= 100 ? "good" : pct >= 70 ? "mid" : "bad");
    i.style.width = `${Math.min(100, pct)}%`;
  } else {
    i.style.width = "0";
  }
  b.appendChild(i);
  return b;
}

function pctText(fact, plan) {
  return plan ? ` · ${Math.round((fact / plan) * 100)}%` : "";
}

function progressRow(label, fact, plan, isMoney) {
  const row = el("div", "row");
  const head = el("div", "row-head");
  head.appendChild(el("span", "", label));
  const f = isMoney ? money(fact) : fmt(fact);
  const value = el("b", "", plan ? `${f} / ${isMoney ? money(plan) : fmt(plan)}${pctText(fact, plan)}` : f);
  if (!plan) value.appendChild(el("span", "muted", " · план не задан"));
  head.appendChild(value);
  row.append(head, bar(fact, plan));
  return row;
}

function renderPeriods() {
  const seg = $("periods");
  seg.innerHTML = "";
  Object.entries(data.periods).forEach(([key, label]) => {
    const b = el("button", key === period ? "active" : "", label);
    b.onclick = () => { period = key; history.replaceState(null, "", `?period=${key}`); load(); };
    seg.appendChild(b);
  });
  const p = data.period;
  const range = p.start === p.end ? p.start : `${p.start} — ${p.end}`;
  $("periodInfo").textContent = `${p.label}: ${range} · рабочих дней: ${p.workdays}`;
}

function sum(list, pick) { return list.reduce((acc, x) => acc + (pick(x) || 0), 0); }
function sumPlan(list, pick) {
  const vals = list.map(pick).filter((v) => v !== null && v !== undefined);
  return vals.length ? vals.reduce((a, b) => a + b, 0) : null;
}

function renderKpis() {
  const e = data.employees;
  const items = [
    ["Звонки", sum(e, (x) => x.fact.calls), sumPlan(e, (x) => x.plan_period.calls), false],
    ["Продажи (поступления)", sum(e, (x) => x.fact.payments_sum), sumPlan(e, (x) => x.plan_period.sales), true],
    ["Новые подключения", sum(e, (x) => x.fact.new_connections), sumPlan(e, (x) => x.plan_period.connections), false],
    ["Договоры", sum(e, (x) => x.fact.contracts_sum), null, true, `${fmt(sum(e, (x) => x.fact.contracts_count))} шт.`],
  ];
  const wrap = $("kpis");
  wrap.innerHTML = "";
  items.forEach(([label, fact, plan, isMoney, extra]) => {
    const c = el("div", "card");
    c.appendChild(el("div", "kpi-label", label));
    c.appendChild(el("div", "kpi-value", isMoney ? money(fact) : fmt(fact)));
    c.appendChild(el("div", "kpi-plan",
      extra || (plan ? `план ${isMoney ? money(plan) : fmt(plan)}${pctText(fact, plan)}` : "план не задан")));
    if (!extra) c.appendChild(bar(fact, plan));
    wrap.appendChild(c);
  });
}

function planInput(emp, field) {
  const input = el("input");
  input.type = "text";
  input.inputMode = "numeric";
  input.placeholder = "не задан";
  input.dataset.key = emp.key;
  input.dataset.field = field;
  const v = emp.plan[field];
  input.value = v === null || v === undefined ? "" : fmt(v);
  // Цифры с пробелами по разрядам — удобнее вводить суммы в сумах.
  input.addEventListener("input", () => {
    const digits = input.value.replace(/\D/g, "");
    input.value = digits ? Number(digits).toLocaleString("ru-RU") : "";
    $("saveStatus").textContent = "Есть несохранённые изменения";
  });
  return input;
}

function renderPlans() {
  const body = $("plansBody");
  body.innerHTML = "";
  data.employees.forEach((emp) => {
    const tr = el("tr");
    tr.appendChild(el("td", "", emp.name));
    ["calls_daily", "sales_monthly", "connections_monthly"].forEach((f) => {
      const td = el("td");
      td.appendChild(planInput(emp, f));
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

function mini(label, value) {
  const d = el("div");
  d.appendChild(el("span", "", label));
  d.appendChild(el("b", "", value));
  return d;
}

function renderPeople() {
  const wrap = $("people");
  wrap.innerHTML = "";
  data.employees.forEach((emp) => {
    const c = el("div", "card");
    const head = el("div", "person-head");
    head.appendChild(el("div", "person-name", emp.name));
    head.appendChild(el("div", emp.connected ? "tag" : "tag off",
      emp.connected ? emp.style : "не подключён к боту"));
    c.appendChild(head);

    const f = emp.fact, p = emp.plan_period;
    c.appendChild(progressRow("Звонки", f.calls, p.calls, false));
    c.appendChild(progressRow("Продажи (поступления)", f.payments_sum, p.sales, true));
    c.appendChild(progressRow("Новые подключения", f.new_connections, p.connections, false));

    const m = el("div", "mini");
    m.append(
      mini("Встреч проведено", fmt(f.meetings_held)),
      mini("Новых встреч назначено", fmt(f.meetings_new)),
      mini("КП", `${fmt(f.kp_count)} · ${money(f.kp_sum)}`),
      mini("Договоры", `${fmt(f.contracts_count)} · ${money(f.contracts_sum)}`),
    );
    c.appendChild(m);

    const r = emp.reports;
    const wd = data.period.workdays;
    c.appendChild(el("div", "reports-line",
      `Отчёты: итоги дня ${r.evening} из ${wd} · стендапы ${r.standup} из ${wd}` +
      (r.late ? ` · с опозданием: ${r.late}` : "")));
    wrap.appendChild(c);
  });
}

function renderReports() {
  const wrap = $("reports");
  wrap.innerHTML = "";
  if (!data.reports.length) {
    wrap.appendChild(el("div", "empty", "За этот период отчётов пока нет."));
    return;
  }
  data.reports.forEach((r) => {
    const d = el("details");
    const s = el("summary");
    s.appendChild(el("b", "", r.name));
    s.appendChild(el("span", "", r.kind));
    s.appendChild(el("span", "muted", `${r.date}${r.time ? " · " + r.time : ""}`));
    d.appendChild(s);
    d.appendChild(el("div", "report-text", r.text || "—"));
    wrap.appendChild(d);
  });
}

function showError(text) {
  $("error").style.display = text ? "block" : "none";
  $("error").textContent = text || "";
}

async function load() {
  try {
    const resp = await fetch(`${base}/api/data?period=${encodeURIComponent(period)}`);
    if (!resp.ok) throw new Error(resp.status);
    data = await resp.json();
    showError("");
  } catch (e) {
    showError("Не удалось загрузить данные. Обнови страницу.");
    return;
  }
  renderPeriods();
  renderKpis();
  renderPlans();
  renderPeople();
  renderReports();
}

async function savePlans() {
  const btn = $("saveBtn");
  const plans = {};
  document.querySelectorAll("#plansBody input").forEach((i) => {
    plans[i.dataset.key] = plans[i.dataset.key] || { key: i.dataset.key };
    plans[i.dataset.key][i.dataset.field] = i.value.replace(/\D/g, "") || null;
  });
  btn.disabled = true;
  $("saveStatus").textContent = "Сохраняю…";
  try {
    const resp = await fetch(`${base}/api/plans`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ plans: Object.values(plans) }),
    });
    if (!resp.ok) throw new Error(resp.status);
    $("saveStatus").textContent = "✅ Планы сохранены — AI уже сверяет с ними отчёты";
    await load();
  } catch (e) {
    $("saveStatus").textContent = "Не удалось сохранить. Попробуй ещё раз.";
  } finally {
    btn.disabled = false;
  }
}

$("saveBtn").onclick = savePlans;
load();
</script>
</body>
</html>
