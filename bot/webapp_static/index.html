<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>РОП</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --bubble-bot: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #tabs {
    display: flex;
    border-bottom: 1px solid rgba(128,128,128,0.2);
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--hint);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--button); }
  .badge {
    display: inline-block;
    min-width: 20px;
    padding: 1px 6px;
    margin-left: 4px;
    border-radius: 10px;
    background: var(--button);
    color: var(--button-text);
    font-size: 12px;
    line-height: 18px;
  }
  .badge.alert { background: #e53935; color: #fff; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }
  #view-tasks { overflow-y: auto; padding: 12px; gap: 10px; }
  #tasksSummary { display: flex; gap: 8px; }
  .stat {
    flex: 1;
    padding: 10px 8px;
    border-radius: 12px;
    background: var(--bubble-bot);
    text-align: center;
  }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--hint); }
  .stat.alert b { color: #e53935; }
  .section-title { margin: 8px 2px 0; font-size: 13px; color: var(--hint); font-weight: 600; }
  #tasksList { display: flex; flex-direction: column; gap: 10px; }
  .task {
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--bubble-bot);
    border-left: 4px solid var(--button);
  }
  .task.overdue { border-left-color: #e53935; }
  .task.pending { border-left-color: #fb8c00; }
  .task.done { opacity: 0.6; border-left-color: var(--hint); }
  .task-title { font-weight: 600; font-size: 15px; }
  .task-desc { margin-top: 4px; font-size: 14px; white-space: pre-wrap; }
  .task-meta {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    color: var(--hint);
  }
  .countdown { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .task.overdue .countdown { color: #e53935; }
  .task .action-btn { width: 100%; margin-top: 10px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .employee {
    align-self: flex-end;
    background: var(--button);
    color: var(--button-text);
    border-bottom-right-radius: 4px;
  }
  #actions {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .action-btn {
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--button);
    color: var(--button-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #inputbar {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(128,128,128,0.2);
  }
  #textInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(128,128,128,0.3);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  #sendBtn, #micBtn {
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    background: var(--button);
    color: var(--button-text);
    font-weight: 600;
    cursor: pointer;
  }
  #micBtn { padding: 0 14px; background: var(--bubble-bot); }
  #micBtn.recording { background: #e53935; color: #fff; }
  #sendBtn:disabled, #micBtn:disabled { opacity: 0.5; }
  #status {
    text-align: center;
    color: var(--hint);
    font-size: 13px;
    padding: 20px;
  }
</style>
</head>
<body>
  <nav id="tabs">
    <button class="tab active" data-view="chat">💬 РОП</button>
    <button class="tab" data-view="tasks">📋 Задачи <span id="tasksBadge" class="badge" hidden></span></button>
  </nav>

  <section id="view-chat" class="view active">
    <div id="chat"></div>
    <div id="actions"></div>
    <div id="inputbar" style="display:none;">
      <input id="textInput" type="text" placeholder="Напиши сообщение..." />
      <button id="micBtn" title="Голосовое сообщение">🎤</button>
      <button id="sendBtn">➤</button>
    </div>
  </section>

  <section id="view-tasks" class="view">
    <div id="tasksSummary"></div>
    <div id="tasksList"></div>
  </section>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const initData = tg ? tg.initData : "";
const chatEl = document.getElementById("chat");
const actionsEl = document.getElementById("actions");
const inputbarEl = document.getElementById("inputbar");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

function addBubble(sender, text) {
  const div = document.createElement("div");
  div.className = "bubble " + (sender === "employee" ? "employee" : "bot");
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderActions(pendingAction, awaitingAnswer) {
  actionsEl.innerHTML = "";
  if (awaitingAnswer) {
    inputbarEl.style.display = "flex";
    return;
  }
  if (pendingAction === "start_standup") {
    inputbarEl.style.display = "none";
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🚀 Начать рабочий день";
    btn.onclick = () => callStart();
    actionsEl.appendChild(btn);
  } else if (pendingAction === "start_evening") {
    inputbarEl.style.display = "flex";
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🌙 Подвести итоги дня";
    btn.onclick = () => callStart();
    actionsEl.appendChild(btn);
  } else {
    inputbarEl.style.display = "flex";
  }
}

async function api(path, body) {
  const resp = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData }, body || {})),
  });
  return resp.json();
}

async function loadState() {
  const data = await api("/api/state");
  if (data.error) {
    const div = document.createElement("div");
    div.id = "status";
    div.textContent =
      data.error === "not_registered"
        ? "Сначала напиши боту /start в обычном чате и выбери своё имя."
        : "Не удалось загрузить чат. Попробуй переоткрыть приложение.";
    chatEl.innerHTML = "";
    chatEl.appendChild(div);
    return;
  }
  chatEl.innerHTML = "";
  data.messages.forEach((m) => addBubble(m.sender, m.text));
  renderActions(data.pending_action, data.awaiting_answer);
}

async function callStart() {
  const data = await api("/api/start");
  if (data.error) { await loadState(); return; }
  await loadState();
}

async function sendMessage() {
  const text = textInput.value.trim();
  if (!text || sendBtn.disabled) return;
  addBubble("employee", text);
  textInput.value = "";
  setBusy(true);
  const typing = addPlaceholder("печатает…");
  try {
    const data = await api("/api/message", { text });
    if (!data.error) {
      await loadState();
    }
  } finally {
    typing.remove();
    setBusy(false);
  }
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  micBtn.disabled = busy;
}

function addPlaceholder(text) {
  const div = document.createElement("div");
  div.className = "bubble bot";
  div.style.opacity = "0.6";
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function notify(text) {
  if (tg && tg.showAlert) tg.showAlert(text); else alert(text);
}

// ---------- голосовые ----------
const micBtn = document.getElementById("micBtn");
let recorder = null;
let recordChunks = [];
let recordTimer = null;
const MAX_RECORD_SECONDS = 300;

function pickMimeType() {
  const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  if (!window.MediaRecorder) return null;
  return types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

async function startRecording() {
  const mimeType = pickMimeType();
  if (mimeType === null || !navigator.mediaDevices) {
    notify("Запись голоса здесь недоступна — отправь голосовое прямо в чат с ботом.");
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    notify("Нет доступа к микрофону. Разреши его или отправь голосовое в чат с ботом.");
    return;
  }
  recordChunks = [];
  recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) recordChunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(recordChunks, { type: recorder.mimeType || "audio/webm" });
    recorder = null;
    sendVoice(blob);
  };
  recorder.start();

  let seconds = 0;
  micBtn.classList.add("recording");
  micBtn.textContent = "⏹ 0:00";
  sendBtn.disabled = true;
  recordTimer = setInterval(() => {
    seconds += 1;
    micBtn.textContent = `⏹ ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    if (seconds >= MAX_RECORD_SECONDS) stopRecording();
  }, 1000);
}

function stopRecording() {
  clearInterval(recordTimer);
  micBtn.classList.remove("recording");
  micBtn.textContent = "🎤";
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

async function sendVoice(blob) {
  if (!blob.size) { setBusy(false); return; }
  setBusy(true);
  const placeholder = addPlaceholder("🎤 распознаю голосовое…");
  try {
    const form = new FormData();
    form.append("initData", initData);
    form.append("audio", blob, "voice");
    const resp = await fetch("/api/voice", { method: "POST", body: form });
    const data = await resp.json();
    if (data.error === "not_recognized") {
      notify("Не смог разобрать голосовое. Попробуй ещё раз или напиши текстом.");
    } else if (data.error) {
      notify("Не удалось отправить голосовое. Попробуй ещё раз.");
    }
    await loadState();
  } catch (e) {
    notify("Не удалось отправить голосовое. Проверь интернет и попробуй ещё раз.");
  } finally {
    placeholder.remove();
    setBusy(false);
  }
}

micBtn.onclick = () => {
  if (micBtn.disabled) return;
  if (recorder) stopRecording(); else startRecording();
};

sendBtn.onclick = sendMessage;
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

// ---------- разделы ----------
const tabButtons = document.querySelectorAll(".tab");

function showView(name) {
  tabButtons.forEach((b) => b.classList.toggle("active", b.dataset.view === name));
  document.querySelectorAll(".view").forEach((v) =>
    v.classList.toggle("active", v.id === "view-" + name)
  );
  if (name === "tasks") loadTasks();
}

tabButtons.forEach((b) => (b.onclick = () => showView(b.dataset.view)));

// ---------- задачи ----------
const tasksBadge = document.getElementById("tasksBadge");
const tasksSummaryEl = document.getElementById("tasksSummary");
const tasksListEl = document.getElementById("tasksList");
let taskTimers = [];   // [{el, deadlineMs}] для тикающих счётчиков до дедлайна

const STATUS_LABELS = {
  pending: "⏳ Ждёт принятия",
  overdue: "🔴 Просрочена",
  accepted: "🖐 В работе",
  scheduled: "📅 Запланировано",
};

function formatLeft(ms) {
  const overdue = ms < 0;
  let s = Math.floor(Math.abs(ms) / 1000);
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60);
  let text;
  if (d > 0) text = `${d} д ${h} ч`;
  else if (h > 0) text = `${h} ч ${m} мин`;
  else text = `${m} мин ${s % 60} с`;
  return overdue ? `просрочено на ${text}` : `осталось ${text}`;
}

function tickCountdowns() {
  const now = Date.now();
  taskTimers.forEach((t) => { t.el.textContent = formatLeft(t.deadlineMs - now); });
}
setInterval(tickCountdowns, 1000);

function renderBadge(counts) {
  tasksBadge.hidden = counts.active === 0;
  tasksBadge.textContent = counts.active;
  tasksBadge.classList.toggle("alert", counts.to_accept > 0);
}

function stat(value, label, alert) {
  const div = document.createElement("div");
  div.className = "stat" + (alert && value > 0 ? " alert" : "");
  const b = document.createElement("b");
  b.textContent = value;
  const span = document.createElement("span");
  span.textContent = label;
  div.append(b, span);
  return div;
}

function taskCard(t, loadedAt) {
  const card = document.createElement("div");
  card.className = "task " + (t.active ? t.status : "done");

  const title = document.createElement("div");
  title.className = "task-title";
  title.textContent = (t.auto ? "🤖 " : "") + t.title;
  if (t.auto) title.title = "AI поставил задачу по твоему сообщению в чате";
  card.appendChild(title);

  if (t.description && t.description !== t.title) {
    const desc = document.createElement("div");
    desc.className = "task-desc";
    desc.textContent = t.description;
    card.appendChild(desc);
  }

  const meta = document.createElement("div");
  meta.className = "task-meta";
  const status = document.createElement("span");
  if (t.active) status.textContent = STATUS_LABELS[t.status];
  else if (t.status === "done") status.textContent = t.closed_by_ai ? "✅ Выполнена · закрыл AI" : "✅ Выполнена";
  else status.textContent = `Срок был ${t.deadline}`;
  meta.appendChild(status);
  if (t.active) {
    const countdown = document.createElement("span");
    countdown.className = "countdown";
    countdown.title = `Дедлайн: ${t.deadline}`;
    meta.appendChild(countdown);
    taskTimers.push({ el: countdown, deadlineMs: loadedAt + t.seconds_left * 1000 });
  }
  card.appendChild(meta);

  if (t.close_note) {
    const note = document.createElement("div");
    note.className = "task-desc";
    note.style.color = "var(--hint)";
    note.textContent = `«${t.close_note}»`;
    card.appendChild(note);
  }

  if (!t.auto && (t.status === "pending" || t.status === "overdue")) {
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🖐 Принять";
    btn.onclick = () => acceptTask(t.id, btn);
    card.appendChild(btn);
  }
  return card;
}

async function loadTasks() {
  const data = await api("/api/tasks");
  if (data.error) return;
  const loadedAt = Date.now();

  renderBadge(data.counts);
  tasksSummaryEl.innerHTML = "";
  tasksSummaryEl.append(
    stat(data.counts.active, "активных"),
    stat(data.counts.to_accept, "ждут принятия", true),
    stat(data.counts.overdue, "просрочено", true)
  );

  taskTimers = [];
  tasksListEl.innerHTML = "";
  if (!data.tasks.length) {
    const empty = document.createElement("div");
    empty.id = "status";
    empty.textContent = "Задач от руководителя пока нет.";
    tasksListEl.appendChild(empty);
    return;
  }

  const active = data.tasks.filter((t) => t.active);
  const past = data.tasks.filter((t) => !t.active);
  if (active.length) {
    active.forEach((t) => tasksListEl.appendChild(taskCard(t, loadedAt)));
  }
  if (past.length) {
    const h = document.createElement("div");
    h.className = "section-title";
    h.textContent = "Завершённые";
    tasksListEl.appendChild(h);
    past.forEach((t) => tasksListEl.appendChild(taskCard(t, loadedAt)));
  }
  tickCountdowns();
}

async function acceptTask(id, btn) {
  btn.disabled = true;
  const data = await api("/api/tasks/accept", { task_id: id });
  if (data.error) notify("Не удалось принять задачу — возможно, она уже принята или отменена.");
  if (tg && tg.HapticFeedback && !data.error) tg.HapticFeedback.notificationOccurred("success");
  await loadTasks();
}

// Обновляем задачи, когда приложение снова на экране, и раз в минуту — чтобы
// новая задача от руководителя сразу появлялась в счётчике.
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadTasks(); });
setInterval(loadTasks, 60000);

loadState();
loadTasks();
// ?tab=tasks — открыть сразу раздел задач (кнопка в уведомлении о новой задаче).
// Не #tasks: хеш Telegram занимает своими параметрами.
if (new URLSearchParams(location.search).get("tab") === "tasks") showView("tasks");
</script>
</body>
</html>
