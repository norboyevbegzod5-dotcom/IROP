<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>РОП</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --bubble-bot: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #header {
    padding: 12px 16px;
    font-weight: 600;
    border-bottom: 1px solid rgba(128,128,128,0.2);
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .employee {
    align-self: flex-end;
    background: var(--button);
    color: var(--button-text);
    border-bottom-right-radius: 4px;
  }
  #actions {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .action-btn {
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--button);
    color: var(--button-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #inputbar {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(128,128,128,0.2);
  }
  #textInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(128,128,128,0.3);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  #sendBtn, #micBtn {
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    background: var(--button);
    color: var(--button-text);
    font-weight: 600;
    cursor: pointer;
  }
  #micBtn { padding: 0 14px; background: var(--bubble-bot); }
  #micBtn.recording { background: #e53935; color: #fff; }
  #sendBtn:disabled, #micBtn:disabled { opacity: 0.5; }
  #status {
    text-align: center;
    color: var(--hint);
    font-size: 13px;
    padding: 20px;
  }
</style>
</head>
<body>
  <div id="header">РОП — рабочий чат</div>
  <div id="chat"></div>
  <div id="actions"></div>
  <div id="inputbar" style="display:none;">
    <input id="textInput" type="text" placeholder="Напиши сообщение..." />
    <button id="micBtn" title="Голосовое сообщение">🎤</button>
    <button id="sendBtn">➤</button>
  </div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const initData = tg ? tg.initData : "";
const chatEl = document.getElementById("chat");
const actionsEl = document.getElementById("actions");
const inputbarEl = document.getElementById("inputbar");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

function addBubble(sender, text) {
  const div = document.createElement("div");
  div.className = "bubble " + (sender === "employee" ? "employee" : "bot");
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderActions(pendingAction, awaitingAnswer) {
  actionsEl.innerHTML = "";
  if (awaitingAnswer) {
    inputbarEl.style.display = "flex";
    return;
  }
  if (pendingAction === "start_standup") {
    inputbarEl.style.display = "none";
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🚀 Начать рабочий день";
    btn.onclick = () => callStart();
    actionsEl.appendChild(btn);
  } else if (pendingAction === "start_evening") {
    inputbarEl.style.display = "flex";
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🌙 Подвести итоги дня";
    btn.onclick = () => callStart();
    actionsEl.appendChild(btn);
  } else {
    inputbarEl.style.display = "flex";
  }
}

async function api(path, body) {
  const resp = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData }, body || {})),
  });
  return resp.json();
}

async function loadState() {
  const data = await api("/api/state");
  if (data.error) {
    const div = document.createElement("div");
    div.id = "status";
    div.textContent =
      data.error === "not_registered"
        ? "Сначала напиши боту /start в обычном чате и выбери своё имя."
        : "Не удалось загрузить чат. Попробуй переоткрыть приложение.";
    chatEl.innerHTML = "";
    chatEl.appendChild(div);
    return;
  }
  chatEl.innerHTML = "";
  data.messages.forEach((m) => addBubble(m.sender, m.text));
  renderActions(data.pending_action, data.awaiting_answer);
}

async function callStart() {
  const data = await api("/api/start");
  if (data.error) { await loadState(); return; }
  await loadState();
}

async function sendMessage() {
  const text = textInput.value.trim();
  if (!text || sendBtn.disabled) return;
  addBubble("employee", text);
  textInput.value = "";
  setBusy(true);
  const typing = addPlaceholder("печатает…");
  try {
    const data = await api("/api/message", { text });
    if (!data.error) {
      await loadState();
    }
  } finally {
    typing.remove();
    setBusy(false);
  }
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  micBtn.disabled = busy;
}

function addPlaceholder(text) {
  const div = document.createElement("div");
  div.className = "bubble bot";
  div.style.opacity = "0.6";
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function notify(text) {
  if (tg && tg.showAlert) tg.showAlert(text); else alert(text);
}

// ---------- голосовые ----------
const micBtn = document.getElementById("micBtn");
let recorder = null;
let recordChunks = [];
let recordTimer = null;
const MAX_RECORD_SECONDS = 300;

function pickMimeType() {
  const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  if (!window.MediaRecorder) return null;
  return types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

async function startRecording() {
  const mimeType = pickMimeType();
  if (mimeType === null || !navigator.mediaDevices) {
    notify("Запись голоса здесь недоступна — отправь голосовое прямо в чат с ботом.");
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    notify("Нет доступа к микрофону. Разреши его или отправь голосовое в чат с ботом.");
    return;
  }
  recordChunks = [];
  recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) recordChunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(recordChunks, { type: recorder.mimeType || "audio/webm" });
    recorder = null;
    sendVoice(blob);
  };
  recorder.start();

  let seconds = 0;
  micBtn.classList.add("recording");
  micBtn.textContent = "⏹ 0:00";
  sendBtn.disabled = true;
  recordTimer = setInterval(() => {
    seconds += 1;
    micBtn.textContent = `⏹ ${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    if (seconds >= MAX_RECORD_SECONDS) stopRecording();
  }, 1000);
}

function stopRecording() {
  clearInterval(recordTimer);
  micBtn.classList.remove("recording");
  micBtn.textContent = "🎤";
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

async function sendVoice(blob) {
  if (!blob.size) { setBusy(false); return; }
  setBusy(true);
  const placeholder = addPlaceholder("🎤 распознаю голосовое…");
  try {
    const form = new FormData();
    form.append("initData", initData);
    form.append("audio", blob, "voice");
    const resp = await fetch("/api/voice", { method: "POST", body: form });
    const data = await resp.json();
    if (data.error === "not_recognized") {
      notify("Не смог разобрать голосовое. Попробуй ещё раз или напиши текстом.");
    } else if (data.error) {
      notify("Не удалось отправить голосовое. Попробуй ещё раз.");
    }
    await loadState();
  } catch (e) {
    notify("Не удалось отправить голосовое. Проверь интернет и попробуй ещё раз.");
  } finally {
    placeholder.remove();
    setBusy(false);
  }
}

micBtn.onclick = () => {
  if (micBtn.disabled) return;
  if (recorder) stopRecording(); else startRecording();
};

sendBtn.onclick = sendMessage;
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

loadState();
</script>
</body>
</html>
