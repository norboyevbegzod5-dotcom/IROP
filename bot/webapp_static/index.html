<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<!-- maximum-scale/user-scalable: мини-апп — это «приложение», масштабировать его не нужно;
     заодно iOS не приближает страницу при фокусе на поле ввода. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>РОП</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --bubble-bot: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;   /* iOS не увеличивает шрифт при повороте */
    text-size-adjust: 100%;
  }
  /* Высота — по реальной видимой области Telegram (--app-height ставит скрипт по
     viewportChanged), чтобы поле ввода не уезжало под клавиатуру. Прокручиваются
     только чат и список задач, сама страница — нет. */
  html, body {
    height: var(--app-height, 100vh);
    width: 100%;
    margin: 0;
    overflow: hidden;
  }
  button { touch-action: manipulation; }   /* без приближения по двойному тапу */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #tabs {
    display: flex;
    border-bottom: 1px solid rgba(128,128,128,0.2);
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--hint);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--button); }
  .badge {
    display: inline-block;
    min-width: 20px;
    padding: 1px 6px;
    margin-left: 4px;
    border-radius: 10px;
    background: var(--button);
    color: var(--button-text);
    font-size: 12px;
    line-height: 18px;
  }
  .badge.alert { background: #e53935; color: #fff; }
  .badge[hidden] { display: none; }   /* иначе display: inline-block перебивает hidden и висит «0» */
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }
  #view-tasks { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 12px; gap: 10px; }
  #tasksSummary { display: flex; gap: 8px; }
  .stat {
    flex: 1;
    padding: 10px 8px;
    border-radius: 12px;
    background: var(--bubble-bot);
    text-align: center;
  }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--hint); }
  .stat.alert b { color: #e53935; }
  .section-title { margin: 8px 2px 0; font-size: 13px; color: var(--hint); font-weight: 600; }
  #tasksList { display: flex; flex-direction: column; gap: 10px; }
  .task {
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--bubble-bot);
    border-left: 4px solid var(--button);
  }
  .task.overdue { border-left-color: #e53935; }
  .task.pending { border-left-color: #fb8c00; }
  .task.done { opacity: 0.6; border-left-color: var(--hint); }
  .task-title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .goal-progress { margin-top: 8px; font-size: 13px; }
  .goal-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .goal-bar { height: 6px; border-radius: 999px; background: rgba(128,128,128,0.2); margin: 5px 0 4px; overflow: hidden; }
  .goal-bar i { display: block; height: 100%; border-radius: 999px; background: var(--button); }
  .goal-progress.achieved .goal-bar i, .goal-progress.on_track .goal-bar i { background: #2e9d62; }
  .goal-progress.at_risk .goal-bar i { background: #d39a1c; }
  .goal-progress.behind .goal-bar i { background: #e53935; }
  .goal-sub { color: var(--hint); }
  .task-desc { margin-top: 4px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .task-meta {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    color: var(--hint);
  }
  .countdown { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .task.overdue .countdown { color: #e53935; }
  .task .action-btn { width: 100%; margin-top: 10px; }
  #chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;   /* прокрутка чата не тянет за собой весь мини-апп */
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;   /* длинные ссылки переносятся, а не раздвигают экран */
    font-size: 15px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .employee {
    align-self: flex-end;
    background: var(--button);
    color: var(--button-text);
    border-bottom-right-radius: 4px;
  }
  #actions {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .action-btn {
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: var(--button);
    color: var(--button-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #inputbar {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(128,128,128,0.2);
  }
  #textInput {
    flex: 1;
    min-width: 0;        /* иначе поле не ужимается и выталкивает кнопки за край экрана */
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(128,128,128,0.3);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;     /* < 16px — iOS сам приближает страницу при фокусе */
    outline: none;
  }
  #sendBtn, #micBtn {
    border: none;
    flex-shrink: 0;
    border-radius: 20px;
    padding: 0 18px;
    background: var(--button);
    color: var(--button-text);
    font-weight: 600;
    cursor: pointer;
  }
  #micBtn {
    padding: 0 14px;
    background: var(--bubble-bot);
    touch-action: none;          /* жест свайпа обрабатываем сами, без прокрутки */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #micBtn.recording { background: #e53935; color: #fff; transform-origin: center; }
  #recordOverlay {
    display: none;
    flex: 1;
    min-width: 0;
    align-items: center;
    gap: 10px;
    padding: 0 6px;
    overflow: hidden;
    font-size: 15px;
  }
  #inputbar.is-recording #recordOverlay { display: flex; }
  #inputbar.is-recording #textInput,
  #inputbar.is-recording #sendBtn { display: none; }
  .rec-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e53935;
    animation: rec-blink 1s infinite;
  }
  @keyframes rec-blink { 50% { opacity: 0.2; } }
  #recordTime { font-variant-numeric: tabular-nums; min-width: 40px; }
  #recordHint { margin-left: auto; color: var(--hint); white-space: nowrap; }
  #sendBtn:disabled, #micBtn:disabled { opacity: 0.5; }
  #status {
    text-align: center;
    color: var(--hint);
    font-size: 13px;
    padding: 20px;
  }
  .action-btn.secondary { background: var(--bubble-bot); color: var(--text); }
  /* Итоги дня формой */
  #formPanel { display: none; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px; }
  #view-chat.form-open #formPanel { display: block; }
  #view-chat.form-open #chat, #view-chat.form-open #actions, #view-chat.form-open #inputbar { display: none !important; }
  .form-title { font-size: 17px; font-weight: 700; margin: 2px 2px 4px; }
  .form-sub { font-size: 13px; color: var(--hint); margin: 0 2px 10px; }
  .form-card { background: var(--bubble-bot); border-radius: 14px; padding: 4px 12px; }
  .frow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(128,128,128,0.18); }
  .frow:last-child { border-bottom: 0; }
  .frow label { font-size: 15px; min-width: 0; }
  .stepper { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .sbtn {
    width: 34px; height: 34px; border: none; border-radius: 10px; flex-shrink: 0;
    background: var(--bg); color: var(--button); font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .fnum, .fmoney {
    border: 1px solid rgba(128,128,128,0.3); border-radius: 10px; background: var(--bg); color: var(--text);
    font-size: 16px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; padding: 6px 4px;
  }
  .fnum { width: 54px; }
  .fmoney { width: 150px; text-align: right; padding-right: 10px; }
  #formNote {
    width: 100%; min-height: 84px; margin-top: 10px; padding: 10px 12px; border-radius: 12px; resize: vertical;
    border: 1px solid rgba(128,128,128,0.3); background: var(--bg); color: var(--text); font: inherit; font-size: 16px;
  }
  .form-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-bottom: env(safe-area-inset-bottom); }
  /* Голосовое: «Я понял так» */
  .voice-card { align-self: stretch; background: var(--bubble-bot); border-radius: 16px; padding: 10px 12px; }
  .voice-card .lbl { font-size: 12px; color: var(--hint); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .voice-card textarea {
    width: 100%; margin-top: 6px; min-height: 60px; padding: 8px 10px; border-radius: 10px; resize: vertical;
    border: 1px solid rgba(128,128,128,0.3); background: var(--bg); color: var(--text); font: inherit; font-size: 16px;
  }
  .voice-card .row2 { display: flex; gap: 8px; margin-top: 8px; }
  .voice-card .row2 .action-btn { flex: 1; padding: 10px; }
  /* Сделки */
  #view-deals { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 12px; gap: 10px; }
  #dealsList { display: flex; flex-direction: column; gap: 8px; }
  .stage-head { display: flex; justify-content: space-between; margin: 8px 2px 0; font-size: 13px; color: var(--hint); font-weight: 600; }
  .deal { padding: 10px 12px; border-radius: 14px; background: var(--bubble-bot); }
  .deal-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .deal-brand { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .deal-days { font-size: 12px; color: var(--hint); white-space: nowrap; }
  .deal-days.stale { color: #e53935; font-weight: 600; }
  .deal-btns { display: flex; gap: 6px; margin-top: 8px; }
  .deal-btns button { flex: 1; padding: 8px; border: none; border-radius: 10px; background: var(--bg); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
  .deal-btns button.next { background: var(--button); color: var(--button-text); }
  .deal.closed { opacity: 0.65; }
</style>
</head>
<body>
  <nav id="tabs">
    <button class="tab active" data-view="chat">💬 РОП</button>
    <button class="tab" data-view="tasks">📋 Задачи <span id="tasksBadge" class="badge" hidden></span></button>
    <button class="tab" data-view="deals">🤝 Сделки <span id="dealsBadge" class="badge alert" hidden></span></button>
  </nav>

  <section id="view-chat" class="view active">
    <div id="chat"></div>
    <div id="actions"></div>
    <div id="inputbar" style="display:none;">
      <input id="textInput" type="text" placeholder="Напиши сообщение..." />
      <div id="recordOverlay">
        <span class="rec-dot"></span>
        <span id="recordTime">0:00</span>
        <span id="recordHint">‹ Влево — отмена</span>
      </div>
      <button id="micBtn" title="Удерживай, чтобы записать голосовое">🎤</button>
      <button id="sendBtn">➤</button>
    </div>
    <div id="formPanel">
      <div class="form-title">🌙 Итоги дня</div>
      <div class="form-sub">Заполни цифры — писать текстом не нужно.</div>
      <div class="form-card" id="formFields"></div>
      <textarea id="formNote" placeholder="С кем из утреннего плана поговорил и чем закончилось? (по желанию)"></textarea>
      <div class="form-actions">
        <button class="action-btn" id="formSubmit">Отправить итоги</button>
        <button class="action-btn secondary" id="formCancel">Назад в чат</button>
      </div>
    </div>
  </section>

  <section id="view-tasks" class="view">
    <div id="tasksSummary"></div>
    <div id="tasksList"></div>
  </section>

  <section id="view-deals" class="view">
    <div id="dealsList"></div>
  </section>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// Высота приложения = видимая область Telegram (меняется при открытии клавиатуры,
// разворачивании окна). Без этого 100vh на телефонах больше экрана и низ обрезается.
function syncAppHeight() {
  const h = (tg && tg.viewportHeight) || window.innerHeight;
  document.documentElement.style.setProperty("--app-height", `${h}px`);
}
syncAppHeight();
if (tg && tg.onEvent) tg.onEvent("viewportChanged", syncAppHeight);
window.addEventListener("resize", syncAppHeight);

const initData = tg ? tg.initData : "";
const chatEl = document.getElementById("chat");
const actionsEl = document.getElementById("actions");
const inputbarEl = document.getElementById("inputbar");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

function addBubble(sender, text) {
  const div = document.createElement("div");
  div.className = "bubble " + (sender === "employee" ? "employee" : "bot");
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function actionButton(text, onclick, secondary) {
  const btn = document.createElement("button");
  btn.className = "action-btn" + (secondary ? " secondary" : "");
  btn.textContent = text;
  btn.onclick = onclick;
  actionsEl.appendChild(btn);
}

function renderActions(pendingAction, awaitingAnswer, eveningForm) {
  actionsEl.innerHTML = "";
  if (awaitingAnswer) {
    inputbarEl.style.display = "flex";
    // Итоги дня уже идут в чате — можно дозаполнить формой.
    if (eveningForm) actionButton("📝 Заполнить цифры формой", openForm, true);
    return;
  }
  if (pendingAction === "start_evening" && eveningForm) {
    inputbarEl.style.display = "flex";
    actionButton("📝 Итоги дня формой", openForm);
    actionButton("🌙 Подвести итоги в чате", () => callStart(), true);
    return;
  }
  if (pendingAction === "start_standup") {
    inputbarEl.style.display = "none";
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🚀 Начать рабочий день";
    btn.onclick = () => callStart();
    actionsEl.appendChild(btn);
  } else if (pendingAction === "start_evening") {
    inputbarEl.style.display = "flex";
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🌙 Подвести итоги дня";
    btn.onclick = () => callStart();
    actionsEl.appendChild(btn);
  } else {
    inputbarEl.style.display = "flex";
  }
}

async function api(path, body) {
  const resp = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ initData }, body || {})),
  });
  return resp.json();
}

async function loadState() {
  const data = await api("/api/state");
  if (data.error) {
    const div = document.createElement("div");
    div.id = "status";
    div.textContent =
      data.error === "not_registered"
        ? "Сначала напиши боту /start в обычном чате и выбери своё имя."
        : "Не удалось загрузить чат. Попробуй переоткрыть приложение.";
    chatEl.innerHTML = "";
    chatEl.appendChild(div);
    return;
  }
  chatEl.innerHTML = "";
  data.messages.forEach((m) => addBubble(m.sender, m.text));
  formFields = data.form_fields || [];
  renderActions(data.pending_action, data.awaiting_answer, data.evening_form);
}

// ---------- итоги дня формой ----------
const viewChatEl = document.getElementById("view-chat");
const formFieldsEl = document.getElementById("formFields");
const formNoteEl = document.getElementById("formNote");
const formSubmitBtn = document.getElementById("formSubmit");
let formFields = [];

const digitsOnly = (s) => String(s).replace(/\D/g, "");
const groupDigits = (s) => { const d = digitsOnly(s); return d ? Number(d).toLocaleString("ru-RU") : ""; };

function formRow(f) {
  const row = document.createElement("div");
  row.className = "frow";
  const label = document.createElement("label");
  label.textContent = f.label;
  label.htmlFor = "f-" + f.field;
  const input = document.createElement("input");
  input.id = "f-" + f.field;
  input.dataset.field = f.field;
  input.type = "text";
  input.inputMode = "numeric";
  input.autocomplete = "off";
  if (f.money) {
    // Суммы в сумах — с пробелами по разрядам, чтобы не ошибиться в нулях.
    input.className = "fmoney";
    input.placeholder = "0 сум";
    input.addEventListener("input", () => { input.value = groupDigits(input.value); });
    row.append(label, input);
    return row;
  }
  input.className = "fnum";
  input.value = "0";
  input.addEventListener("input", () => { input.value = digitsOnly(input.value); });
  input.addEventListener("focus", () => input.select());
  const step = (d) => () => {
    input.value = String(Math.max(0, (Number(digitsOnly(input.value)) || 0) + d));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  };
  const minus = document.createElement("button");
  minus.className = "sbtn"; minus.type = "button"; minus.textContent = "−"; minus.onclick = step(-1);
  minus.setAttribute("aria-label", "Меньше");
  const plus = document.createElement("button");
  plus.className = "sbtn"; plus.type = "button"; plus.textContent = "+"; plus.onclick = step(1);
  plus.setAttribute("aria-label", "Больше");
  const box = document.createElement("div");
  box.className = "stepper";
  box.append(minus, input, plus);
  row.append(label, box);
  return row;
}

function openForm() {
  if (!formFieldsEl.childElementCount) formFields.forEach((f) => formFieldsEl.appendChild(formRow(f)));
  viewChatEl.classList.add("form-open");
  document.getElementById("formPanel").scrollTop = 0;
}

function closeForm() {
  viewChatEl.classList.remove("form-open");
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function submitForm() {
  if (formSubmitBtn.disabled) return;
  const values = {};
  formFieldsEl.querySelectorAll("input").forEach((i) => {
    values[i.dataset.field] = Number(digitsOnly(i.value)) || 0;
  });
  formSubmitBtn.disabled = true;
  formSubmitBtn.textContent = "Отправляю…";
  try {
    const data = await api("/api/evening_form", { values, note: formNoteEl.value });
    if (data.error === "already_done") notify("Итоги дня за сегодня уже сданы.");
    else if (data.error) { notify("Не удалось отправить. Попробуй ещё раз."); return; }
    if (tg && tg.HapticFeedback && !data.error) tg.HapticFeedback.notificationOccurred("success");
    formFieldsEl.innerHTML = "";
    formNoteEl.value = "";
    closeForm();
    await loadState();
    loadTasks();
    loadDeals();
  } catch (e) {
    notify("Не удалось отправить. Проверь интернет и попробуй ещё раз.");
  } finally {
    formSubmitBtn.disabled = false;
    formSubmitBtn.textContent = "Отправить итоги";
  }
}

formSubmitBtn.onclick = submitForm;
document.getElementById("formCancel").onclick = closeForm;

async function callStart() {
  const data = await api("/api/start");
  if (data.error) { await loadState(); return; }
  await loadState();
}

async function sendMessage() {
  const text = textInput.value.trim();
  if (!text || sendBtn.disabled) return;
  textInput.value = "";
  await sendText(text);
}

async function sendText(text) {
  addBubble("employee", text);
  setBusy(true);
  const typing = addPlaceholder("печатает…");
  try {
    const data = await api("/api/message", { text });
    if (!data.error) {
      await loadState();
    }
  } finally {
    typing.remove();
    setBusy(false);
  }
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  micBtn.disabled = busy;
}

function addPlaceholder(text) {
  const div = document.createElement("div");
  div.className = "bubble bot";
  div.style.opacity = "0.6";
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function notify(text) {
  if (tg && tg.showAlert) tg.showAlert(text); else alert(text);
}

// ---------- голосовые ----------
const micBtn = document.getElementById("micBtn");
// Как в Telegram: удерживай 🎤 — идёт запись, отпустил — отправлено,
// свайп влево дальше CANCEL_SWIPE_PX — запись отменена.
const recordOverlay = document.getElementById("recordOverlay");
const recordTimeEl = document.getElementById("recordTime");
const recordHintEl = document.getElementById("recordHint");
const MAX_RECORD_SECONDS = 300;
const CANCEL_SWIPE_PX = 110;
const MIN_RECORD_MS = 500;   // короче — считаем случайным касанием

let recorder = null;
let recordChunks = [];
let recordTimer = null;
let recordStartedAt = 0;
let discardRecording = false;
// Жест: pressing — палец на кнопке; startX — откуда начали; starting — ждём микрофон.
const gesture = { pressing: false, starting: false, startX: 0, pointerId: null };

function pickMimeType() {
  const types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  if (!window.MediaRecorder) return null;
  return types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
}

function haptic(kind) {
  if (!tg || !tg.HapticFeedback) return;
  if (kind === "impact") tg.HapticFeedback.impactOccurred("medium");
  else tg.HapticFeedback.notificationOccurred(kind);
}

function setVerticalSwipes(enabled) {
  // Чтобы свайп по экрану во время записи не сворачивал мини-апп (Bot API 7.7+).
  if (!tg) return;
  if (enabled && tg.enableVerticalSwipes) tg.enableVerticalSwipes();
  if (!enabled && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
}

function showRecordingUi(on) {
  inputbarEl.classList.toggle("is-recording", on);
  micBtn.classList.toggle("recording", on);
  micBtn.style.transform = "";
  recordHintEl.style.transform = "";
  recordHintEl.style.opacity = "";
  recordTimeEl.textContent = "0:00";
  setVerticalSwipes(!on);
}

async function startRecording() {
  const mimeType = pickMimeType();
  if (mimeType === null || !navigator.mediaDevices) {
    notify("Запись голоса здесь недоступна — отправь голосовое прямо в чат с ботом.");
    return;
  }
  gesture.starting = true;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    gesture.starting = false;
    notify("Нет доступа к микрофону. Разреши его или отправь голосовое в чат с ботом.");
    return;
  }
  gesture.starting = false;

  // Пока ждали разрешение на микрофон, палец уже отпустили (обычно при первом запуске).
  if (!gesture.pressing) {
    stream.getTracks().forEach((t) => t.stop());
    notify("Микрофон готов. Удерживай 🎤, пока говоришь, и отпусти, чтобы отправить.");
    return;
  }

  recordChunks = [];
  discardRecording = false;
  recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) recordChunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(recordChunks, { type: recorder.mimeType || "audio/webm" });
    recorder = null;
    if (!discardRecording) sendVoice(blob);
  };
  recorder.start();
  recordStartedAt = Date.now();
  haptic("impact");

  showRecordingUi(true);
  recordTimer = setInterval(() => {
    const seconds = Math.floor((Date.now() - recordStartedAt) / 1000);
    recordTimeEl.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    if (seconds >= MAX_RECORD_SECONDS) finishRecording(true);
  }, 250);
}

// send=true — отправить запись, false — выбросить (свайп влево или слишком коротко).
function finishRecording(send) {
  clearInterval(recordTimer);
  gesture.pressing = false;
  showRecordingUi(false);
  if (!recorder) return;
  discardRecording = !send;
  if (recorder.state !== "inactive") recorder.stop();
}

function cancelRecording() {
  finishRecording(false);
  haptic("warning");
}

micBtn.addEventListener("pointerdown", (e) => {
  if (micBtn.disabled || recorder || gesture.starting) return;
  e.preventDefault();
  // Захват нужен, чтобы получать движения пальца за пределами кнопки при свайпе.
  try { micBtn.setPointerCapture(e.pointerId); } catch (err) { /* запишем и без него */ }
  gesture.pressing = true;
  gesture.pointerId = e.pointerId;
  gesture.startX = e.clientX;
  startRecording();
});

micBtn.addEventListener("pointermove", (e) => {
  if (!recorder || !gesture.pressing || e.pointerId !== gesture.pointerId) return;
  const dx = Math.min(0, e.clientX - gesture.startX);
  micBtn.style.transform = `translateX(${dx}px)`;
  recordHintEl.style.transform = `translateX(${dx / 2}px)`;
  recordHintEl.style.opacity = String(1 - Math.min(1, -dx / CANCEL_SWIPE_PX) * 0.7);
  if (-dx >= CANCEL_SWIPE_PX) cancelRecording();
});

function onPointerEnd(e) {
  if (e.pointerId !== gesture.pointerId) return;
  if (!gesture.pressing) return;
  gesture.pressing = false;
  if (!recorder) {
    // Отпустили до начала записи: либо просто тап, либо ещё ждём микрофон —
    // во втором случае startRecording сам покажет подсказку.
    if (!gesture.starting) notify("Удерживай 🎤, чтобы записать голосовое. Свайп влево — отмена.");
    return;
  }
  if (e.type === "pointercancel") { cancelRecording(); return; }
  if (Date.now() - recordStartedAt < MIN_RECORD_MS) {
    cancelRecording();
    notify("Слишком коротко — удерживай 🎤, пока говоришь.");
    return;
  }
  finishRecording(true);
}

micBtn.addEventListener("pointerup", onPointerEnd);
micBtn.addEventListener("pointercancel", onPointerEnd);
micBtn.addEventListener("contextmenu", (e) => e.preventDefault());  // долгое нажатие на Android

async function sendVoice(blob) {
  if (!blob.size) { setBusy(false); return; }
  setBusy(true);
  const placeholder = addPlaceholder("🎤 распознаю голосовое…");
  try {
    const form = new FormData();
    form.append("initData", initData);
    form.append("confirm", "1");   // сначала только расшифровка — сотрудник проверит её
    form.append("audio", blob, "voice");
    const resp = await fetch("/api/voice", { method: "POST", body: form });
    const data = await resp.json();
    if (data.error === "not_recognized") {
      notify("Не смог разобрать голосовое. Попробуй ещё раз или напиши текстом.");
    } else if (data.error) {
      notify("Не удалось отправить голосовое. Попробуй ещё раз.");
    } else {
      placeholder.remove();
      setBusy(false);
      showVoiceConfirm(data.text);
      return;
    }
  } catch (e) {
    notify("Не удалось отправить голосовое. Проверь интернет и попробуй ещё раз.");
  }
  placeholder.remove();
  setBusy(false);
}

// «Я понял так»: расшифровку можно поправить прямо в карточке, прежде чем отправить —
// иначе AI запишет в отчёт неверно услышанные цифры и имена клиентов.
function showVoiceConfirm(text) {
  const card = document.createElement("div");
  card.className = "voice-card";
  const lbl = document.createElement("div");
  lbl.className = "lbl";
  lbl.textContent = "🎤 Я понял так";
  const area = document.createElement("textarea");
  area.value = text;
  area.readOnly = true;
  const row = document.createElement("div");
  row.className = "row2";
  const ok = document.createElement("button");
  ok.className = "action-btn";
  ok.textContent = "✅ Верно";
  const fix = document.createElement("button");
  fix.className = "action-btn secondary";
  fix.textContent = "✏️ Исправить";
  const drop = document.createElement("button");
  drop.className = "action-btn secondary";
  drop.textContent = "✖️";
  drop.title = "Не отправлять";
  drop.style.flex = "0 0 48px";
  row.append(ok, fix, drop);
  card.append(lbl, area, row);
  chatEl.appendChild(card);
  chatEl.scrollTop = chatEl.scrollHeight;

  fix.onclick = () => {
    area.readOnly = false;
    area.focus();
    area.setSelectionRange(area.value.length, area.value.length);
    fix.hidden = true;
    ok.textContent = "➤ Отправить";
  };
  drop.onclick = () => card.remove();
  ok.onclick = async () => {
    const value = area.value.trim();
    if (!value || sendBtn.disabled) return;
    card.remove();
    await sendText(value);
  };
}

sendBtn.onclick = sendMessage;
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

// ---------- разделы ----------
const tabButtons = document.querySelectorAll(".tab");

function showView(name) {
  tabButtons.forEach((b) => b.classList.toggle("active", b.dataset.view === name));
  document.querySelectorAll(".view").forEach((v) =>
    v.classList.toggle("active", v.id === "view-" + name)
  );
  if (name === "tasks") loadTasks();
  if (name === "deals") loadDeals();
}

tabButtons.forEach((b) => (b.onclick = () => showView(b.dataset.view)));

// ---------- задачи ----------
const tasksBadge = document.getElementById("tasksBadge");
const tasksSummaryEl = document.getElementById("tasksSummary");
const tasksListEl = document.getElementById("tasksList");
let taskTimers = [];   // [{el, deadlineMs}] для тикающих счётчиков до дедлайна

const STATUS_LABELS = {
  pending: "⏳ Ждёт принятия",
  overdue: "🔴 Просрочена",
  accepted: "🖐 В работе",
  scheduled: "📅 Запланировано",
};

function formatLeft(ms) {
  const overdue = ms < 0;
  let s = Math.floor(Math.abs(ms) / 1000);
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60);
  let text;
  if (d > 0) text = `${d} д ${h} ч`;
  else if (h > 0) text = `${h} ч ${m} мин`;
  else text = `${m} мин ${s % 60} с`;
  return overdue ? `просрочено на ${text}` : `осталось ${text}`;
}

function tickCountdowns() {
  const now = Date.now();
  taskTimers.forEach((t) => { t.el.textContent = formatLeft(t.deadlineMs - now); });
}
setInterval(tickCountdowns, 1000);

function renderBadge(counts) {
  tasksBadge.hidden = counts.active === 0;
  tasksBadge.textContent = counts.active;
  tasksBadge.classList.toggle("alert", counts.to_accept > 0);
}

function stat(value, label, alert) {
  const div = document.createElement("div");
  div.className = "stat" + (alert && value > 0 ? " alert" : "");
  const b = document.createElement("b");
  b.textContent = value;
  const span = document.createElement("span");
  span.textContent = label;
  div.append(b, span);
  return div;
}

function goalValue(g, n) {
  if (!g.money) return String(n);
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".0", "").replace(".", ",") + " млн";
  if (n >= 1e3) return Math.round(n / 1e3) + " тыс";
  return n + " сум";
}

// Прогресс цели («150 звонков за неделю») по цифрам вечерних отчётов.
function goalProgress(g) {
  const box = document.createElement("div");
  box.className = "goal-progress " + g.state;
  const head = document.createElement("div");
  head.className = "goal-head";
  const label = document.createElement("span");
  label.textContent = `${g.metric_icon} ${g.metric_label}`;
  const value = document.createElement("span");
  value.textContent = `${goalValue(g, g.fact)} / ${goalValue(g, g.target)}`;
  head.append(label, value);
  const bar = document.createElement("div");
  bar.className = "goal-bar";
  const fill = document.createElement("i");
  fill.style.width = Math.min(100, (g.fact / g.target) * 100) + "%";
  bar.appendChild(fill);
  const sub = document.createElement("div");
  sub.className = "goal-sub";
  const parts = [];
  if (!g.goal_status) {
    parts.push(g.state_label.replace("успевает", "успеваешь"));
    if (g.per_day) parts.push(`нужно ${goalValue(g, g.per_day)} в день`);
    if (g.forecast !== null && g.state !== "achieved") parts.push(`прогноз ${goalValue(g, g.forecast)}`);
  }
  sub.textContent = parts.join(" · ") || "считаю по вечерним отчётам";
  box.append(head, bar, sub);
  return box;
}

function taskCard(t, loadedAt) {
  const card = document.createElement("div");
  card.className = "task " + (t.active ? t.status : "done");

  const title = document.createElement("div");
  title.className = "task-title";
  title.textContent = (t.auto ? "🤖 " : "") + t.title;
  if (t.auto) title.title = "AI поставил задачу по твоему сообщению в чате";
  card.appendChild(title);

  if (t.description && t.description !== t.title) {
    const desc = document.createElement("div");
    desc.className = "task-desc";
    desc.textContent = t.description;
    card.appendChild(desc);
  }

  if (t.goal) card.appendChild(goalProgress(t.goal));

  const meta = document.createElement("div");
  meta.className = "task-meta";
  const status = document.createElement("span");
  if (t.goal && t.goal.goal_status === "achieved") status.textContent = "🏆 Цель выполнена";
  else if (t.goal && t.goal.goal_status === "missed") status.textContent = "⌛️ Цель не выполнена";
  else if (t.active) status.textContent = STATUS_LABELS[t.status];
  else if (t.status === "done") status.textContent = t.closed_by_ai ? "✅ Выполнена · закрыл AI" : "✅ Выполнена";
  else status.textContent = `Срок был ${t.deadline}`;
  meta.appendChild(status);
  if (t.active) {
    const countdown = document.createElement("span");
    countdown.className = "countdown";
    countdown.title = `Дедлайн: ${t.deadline}`;
    meta.appendChild(countdown);
    taskTimers.push({ el: countdown, deadlineMs: loadedAt + t.seconds_left * 1000 });
  }
  card.appendChild(meta);

  if (t.close_note) {
    const note = document.createElement("div");
    note.className = "task-desc";
    note.style.color = "var(--hint)";
    note.textContent = `«${t.close_note}»`;
    card.appendChild(note);
  }

  if (!t.auto && (t.status === "pending" || t.status === "overdue")) {
    const btn = document.createElement("button");
    btn.className = "action-btn";
    btn.textContent = "🖐 Принять";
    btn.onclick = () => acceptTask(t.id, btn);
    card.appendChild(btn);
  }
  return card;
}

async function loadTasks() {
  const data = await api("/api/tasks");
  if (data.error) return;
  const loadedAt = Date.now();

  renderBadge(data.counts);
  tasksSummaryEl.innerHTML = "";
  tasksSummaryEl.append(
    stat(data.counts.active, "активных"),
    stat(data.counts.to_accept, "ждут принятия", true),
    stat(data.counts.overdue, "просрочено", true)
  );

  taskTimers = [];
  tasksListEl.innerHTML = "";
  if (!data.tasks.length) {
    const empty = document.createElement("div");
    empty.id = "status";
    empty.textContent = "Задач от руководителя пока нет.";
    tasksListEl.appendChild(empty);
    return;
  }

  const active = data.tasks.filter((t) => t.active);
  const past = data.tasks.filter((t) => !t.active);
  if (active.length) {
    active.forEach((t) => tasksListEl.appendChild(taskCard(t, loadedAt)));
  }
  if (past.length) {
    const h = document.createElement("div");
    h.className = "section-title";
    h.textContent = "Завершённые";
    tasksListEl.appendChild(h);
    past.forEach((t) => tasksListEl.appendChild(taskCard(t, loadedAt)));
  }
  tickCountdowns();
}

async function acceptTask(id, btn) {
  btn.disabled = true;
  const data = await api("/api/tasks/accept", { task_id: id });
  if (data.error) notify("Не удалось принять задачу — возможно, она уже принята или отменена.");
  if (tg && tg.HapticFeedback && !data.error) tg.HapticFeedback.notificationOccurred("success");
  await loadTasks();
}

// ---------- сделки (мини-CRM) ----------
// Доску собирает AI из сообщений («с Evos договорились на встречу»), сотрудник двигает
// сделки кнопками. Без движения STALE_DAYS+ дней — сделка подсвечена как зависшая.
const dealsListEl = document.getElementById("dealsList");
const dealsBadge = document.getElementById("dealsBadge");

function dealCard(d, stages, lost) {
  const card = document.createElement("div");
  const open = d.stage !== "paid" && d.stage !== lost.key;
  card.className = "deal" + (open ? "" : " closed");
  const top = document.createElement("div");
  top.className = "deal-top";
  const brand = document.createElement("span");
  brand.className = "deal-brand";
  brand.textContent = d.brand;
  const days = document.createElement("span");
  days.className = "deal-days" + (d.stale ? " stale" : "");
  days.textContent = d.days === 0 ? "сегодня" : d.stale ? `${d.days} дн. без движения` : `${d.days} дн. на этапе`;
  top.append(brand, days);
  card.appendChild(top);

  const btns = document.createElement("div");
  btns.className = "deal-btns";
  const idx = stages.findIndex((s) => s.key === d.stage);
  const add = (text, stage, cls) => {
    const b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = () => moveDeal(d.id, stage, b);
    btns.appendChild(b);
  };
  if (open && idx >= 0 && idx < stages.length - 1) {
    const next = stages[idx + 1];
    add(`→ ${next.icon} ${next.label}`, next.key, "next");
  }
  if (open) add("✖️ Отказ", lost.key);
  else add("↺ Вернуть в работу", stages[0].key);
  card.appendChild(btns);
  return card;
}

async function loadDeals() {
  const data = await api("/api/deals");
  if (data.error) return;
  const stale = data.deals.filter((d) => d.stale).length;
  dealsBadge.hidden = stale === 0;
  dealsBadge.textContent = stale;

  dealsListEl.innerHTML = "";
  if (!data.deals.length) {
    const empty = document.createElement("div");
    empty.id = "status";
    empty.textContent = "Сделок пока нет. Называй клиентов в стендапе и итогах дня — я сам соберу их сюда.";
    dealsListEl.appendChild(empty);
    return;
  }
  const columns = data.stages.concat([Object.assign({ icon: "✖️" }, data.lost)]);
  columns.forEach((s) => {
    const list = data.deals.filter((d) => d.stage === s.key);
    if (!list.length) return;
    const head = document.createElement("div");
    head.className = "stage-head";
    const name = document.createElement("span");
    name.textContent = `${s.icon} ${s.label}`;
    const count = document.createElement("span");
    count.textContent = list.length;
    head.append(name, count);
    dealsListEl.appendChild(head);
    list.forEach((d) => dealsListEl.appendChild(dealCard(d, data.stages, data.lost)));
  });
}

async function moveDeal(id, stage, btn) {
  btn.disabled = true;
  const data = await api("/api/deals/move", { deal_id: id, stage });
  if (data.error) { notify("Не удалось переместить сделку."); btn.disabled = false; return; }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  loadDeals();
}

// Обновляем задачи, когда приложение снова на экране, и раз в минуту — чтобы
// новая задача от руководителя сразу появлялась в счётчике.
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadTasks(); loadDeals(); } });
setInterval(loadTasks, 60000);

loadState();
loadTasks();
loadDeals();
// ?tab=tasks — открыть сразу раздел задач (кнопка в уведомлении о новой задаче).
// Не #tasks: хеш Telegram занимает своими параметрами.
if (new URLSearchParams(location.search).get("tab") === "tasks") showView("tasks");
